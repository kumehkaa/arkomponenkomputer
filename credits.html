<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits - Sistem Komputer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563EB',
                            darkblue: '#1E40AF',
                            purple: '#7C3AED',
                            cyan: '#06B6D4'
                        }
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F8FAFC;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .credit-avatar {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 38%;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
</head>
<body class="min-h-screen text-slate-800 antialiased">
    <header class="fixed top-0 left-0 right-0 z-50 glass-nav border-b border-slate-200/80" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-blue to-brand-purple flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform duration-300">
                        <i class="fa-solid fa-desktop"></i>
                    </div>
                    <div>
                        <span class="text-xl font-bold bg-gradient-to-r from-brand-blue via-brand-purple to-brand-cyan bg-clip-text text-transparent block leading-tight">Sistem Komputer</span>
                        <span class="text-xs text-slate-500 font-medium tracking-wide block">Informatika Kelas IX SMP</span>
                    </div>
                </a>

                <nav class="hidden md:flex items-center gap-1 lg:gap-2" aria-label="Navigasi utama">
                    <a href="index.html" class="px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:text-brand-blue hover:bg-slate-50 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-house text-xs text-slate-400"></i> Beranda
                    </a>
                    <a href="materi.html" class="px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:text-brand-blue hover:bg-slate-50 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-microchip text-xs text-slate-400"></i> Materi
                    </a>
                    <a href="kuis.html" class="px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:text-brand-blue hover:bg-slate-50 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-xs text-slate-400"></i> Kuis
                    </a>
                    <a href="kameraar.html" class="px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:text-brand-blue hover:bg-slate-50 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-camera-rotate text-xs text-slate-400"></i> Kamera AR
                    </a>
                    <a href="credits.html" aria-current="page" class="px-3 py-2 rounded-xl text-sm font-semibold bg-blue-50 text-brand-blue transition-all flex items-center gap-2">
                        <i class="fa-solid fa-users text-xs"></i> Credits
                    </a>
                </nav>

                <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Aktifkan mode gelap" aria-pressed="false" title="Mode gelap">
                    <i id="theme-toggle-icon" class="fa-solid fa-moon" aria-hidden="true"></i>
                </button>
                <button id="mobile-menu-btn" type="button" class="md:hidden p-2.5 rounded-xl text-slate-600 hover:text-brand-blue hover:bg-slate-100 transition-colors focus:outline-none" aria-label="Buka Menu Navigasi" aria-expanded="false" aria-controls="mobile-menu">
                    <i id="hamburger-icon" class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>

        <nav id="mobile-menu" class="hidden md:hidden border-t border-slate-100 bg-white/95 backdrop-blur-md px-4 pt-3 pb-6 space-y-2 shadow-xl" aria-label="Navigasi seluler">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 font-medium text-sm">
                <i class="fa-solid fa-house w-5 text-center text-slate-400"></i> Beranda
            </a>
            <a href="materi.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 font-medium text-sm">
                <i class="fa-solid fa-microchip w-5 text-center text-slate-400"></i> Materi
            </a>
            <a href="kuis.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 font-medium text-sm">
                <i class="fa-solid fa-pen-to-square w-5 text-center text-slate-400"></i> Kuis
            </a>
            <a href="kameraar.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 font-medium text-sm">
                <i class="fa-solid fa-camera-rotate w-5 text-center text-slate-400"></i> Kamera AR
            </a>
            <a href="credits.html" aria-current="page" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-brand-blue font-semibold text-sm">
                <i class="fa-solid fa-users w-5 text-center"></i> Credits
            </a>
        </nav>
    </header>

    <main class="px-4 pt-28 pb-16 sm:px-6 lg:px-8">
        <section class="mx-auto max-w-4xl overflow-hidden rounded-3xl bg-white shadow-xl">
            <div class="bg-gradient-to-r from-brand-blue via-indigo-600 to-brand-purple px-6 py-12 text-center text-white sm:px-12">
                <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-white/15 text-3xl">
                    <i class="fa-solid fa-users"></i>
                </div>
                <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-blue-100">Media Pembelajaran Informatika</p>
                <h1 class="text-3xl font-extrabold sm:text-4xl">Credits</h1>
                <p class="mx-auto mt-3 max-w-xl text-blue-100">Website pembelajaran Sistem Komputer ini dibuat oleh:</p>
            </div>

            <div class="grid gap-5 p-6 sm:grid-cols-2 sm:p-10">
                <article class="rounded-2xl border border-blue-100 bg-blue-50/60 p-6 text-center">
                    <img class="credit-avatar mx-auto mb-4" src="aset/credits-eka.jpg" alt="Foto profil I Putu Eka Aditya Adi Putra">
                    <h2 class="text-lg font-bold text-slate-900">I PUTU EKA ADITYA ADI PUTRA</h2>
                    <p class="mt-1 text-sm font-medium text-slate-500">Pembuat</p>
                </article>
                <article class="rounded-2xl border border-purple-100 bg-purple-50/60 p-6 text-center">
                    <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-purple-100 text-xl text-brand-purple">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900">AINUN NAJILA</h2>
                    <p class="mt-1 text-sm font-medium text-slate-500">Pembuat</p>
                </article>
            </div>
        </section>
    </main>

    <script>
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');

        mobileMenuBtn.addEventListener('click', () => {
            const isOpen = !mobileMenu.classList.contains('hidden');
            mobileMenu.classList.toggle('hidden', isOpen);
            mobileMenuBtn.setAttribute('aria-expanded', String(!isOpen));
            mobileMenuBtn.setAttribute('aria-label', isOpen ? 'Buka Menu Navigasi' : 'Tutup Menu Navigasi');
            hamburgerIcon.classList.toggle('fa-bars', isOpen);
            hamburgerIcon.classList.toggle('fa-xmark', !isOpen);
        });
    </script>
</body>
</html>
